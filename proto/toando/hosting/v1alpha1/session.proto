syntax = "proto3";

package toando.hosting.v1alpha1;

option go_package = "api.toando.de/go/hosting/v1alpha1;hostingv1alpha1";

service SessionService {
    rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
    rpc GetSession(GetSessionRequest) returns (Session);
    rpc Authenticate(AuthenticateRequest) returns (Session);
}

enum SessionState {
    SESSION_STATE_UNSPECIFIED = 0;
    SESSION_STATE_ANONYMOUS = 1;
    SESSION_STATE_AUTHENTICATED = 2;
}

message Session {
    string id = 1;
    SessionState state = 2;
}

message CreateSessionRequest {}

message CreateSessionResponse {
    string token = 1;
    Session session = 2;
}

message GetSessionRequest {
    string token = 1;
}

message AuthenticateRequest {
    string token = 1;
    string oidc_authorization_code = 2;
}