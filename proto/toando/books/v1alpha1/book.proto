syntax = "proto3";

package toando.books.v1alpha1;

option go_package = "api.toando.de/go/books/v1alpha1;booksv1alpha1";

message Book {
    string id = 1;
    string title = 2;
}

message CreateBookRequest {
    string title = 1;
}

message ListBooksRequest {

}

message ListBooksResponse {
    repeated Book books = 1;
}