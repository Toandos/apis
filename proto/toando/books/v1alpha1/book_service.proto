syntax = "proto3";

package toando.books.v1alpha1;

import "toando/books/v1alpha1/book.proto";

option go_package = "api.toando.de/go/books/v1alpha1;booksv1alpha1";

service BookService {
    rpc CreateBook(CreateBookRequest) returns (Book);
    rpc ListBooks(ListBooksRequest) returns (ListBooksRequest);
}